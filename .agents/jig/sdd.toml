# SDD parent orchestration. Modules own typed work; this graph owns phase
# transitions, exception records, targeted remediation, and final merge review.
[workflow]
name = "sdd"
version = "1"
description = "Production SDD orchestration over typed specification, planning, implementation, validation, compliance, and release-note modules."

[defaults]
backend = "codex"
transport = "acp"
model = "gpt-5.6-luna"
effort = "high"
permission_mode = "acceptEdits"
max_parallel = 5
resource_limits = { research = 5, checks = 3, mutation = 1 }
max_read_only = 5
max_mutating = 1

[[step]]
id = "spec"
type = "subworkflow"
module = "modules/spec.toml"

[[step]]
id = "scope_exception"
type = "agent"
depends_on = ["spec"]
when = "spec.scope_decision != 'proceed'"
skill = "../skills/sdd-write-epic"
inputs = ["@spec.spec_name"]
allowed_tools = ["AskUserQuestion", "Read", "Write"]
isolation = "worktree"
resource_class = "mutation"
mutation_paths = ["docs/specs/**"]
  [step.schema]
  reviewer_identity = "text"
  rationale = "text"
  evidence_digests = { list = "text" }
  scope = "text"
  expiry = "text"
  follow_up_policy = "text"

[[step]]
id = "plan"
type = "subworkflow"
depends_on = ["spec", "scope_exception"]
when = "spec.scope_decision == 'proceed'"
module = "modules/plan.toml"
with = { spec_name = "@spec.spec_name", spec_path = "@spec.spec_path" }

[[step]]
id = "implement_task"
type = "subworkflow"
depends_on = ["plan"]
when = "plan.audit_decision == 'approve'"
module = "modules/implement_task.toml"
with = { spec_name = "@spec.spec_name", task_path = "@plan.task_path" }

[[step]]
id = "implementation_review"
type = "review"
depends_on = ["implement_task"]
when = "implement_task.progress == 'done'"
output_type = { enum = ["continue", "redo", "done"] }
  [[step.review]]
  source = "@implement_task.completion_summary"
  label = "Implementation completion"

  [[step.review]]
  source = "diff"
  label = "Cumulative implementation diff"

[[step]]
id = "capture_remediation_scope"
type = "agent"
depends_on = ["implementation_review"]
when = "implementation_review == 'redo'"
skill = "../skills/sdd-clarify"
inputs = ["@implementation_review", "@implement_task.completion_summary"]
allowed_tools = ["AskUserQuestion"]
isolation = "none"
  [step.schema]
  finding_ids = "text"
  affected_paths = "text"

[[step]]
id = "targeted_remediation"
type = "subworkflow"
depends_on = ["capture_remediation_scope"]
when = "implementation_review == 'redo'"
module = "modules/remediate.toml"
with = { spec_name = "@spec.spec_name", task_path = "@plan.task_path", selected_task = "@implement_task.selected_task", finding_ids = "@capture_remediation_scope.finding_ids", affected_paths = "@capture_remediation_scope.affected_paths" }

[[step]]
id = "validate"
type = "subworkflow"
depends_on = ["implementation_review", "targeted_remediation"]
when = "implementation_review != 'redo'"
module = "modules/validate.toml"
with = { spec_name = "@spec.spec_name" }

[[step]]
id = "validation_exception"
type = "agent"
depends_on = ["validate"]
when = "validate.status == 'fail'"
skill = "../skills/sdd-clarify"
inputs = ["@validate.report"]
allowed_tools = ["AskUserQuestion"]
isolation = "none"
  [step.schema]
  reviewer_identity = "text"
  rationale = "text"
  evidence_digests = { list = "text" }
  scope = "text"
  expiry = "text"
  follow_up_policy = "text"

[[step]]
id = "compliance"
type = "subworkflow"
depends_on = ["validate", "validation_exception"]
module = "modules/compliance.toml"
with = { spec_name = "@spec.spec_name", validation_report = "@validate.report" }

[[step]]
id = "compliance_exception"
type = "agent"
depends_on = ["compliance"]
when = "compliance.status != 'pass'"
skill = "../skills/sdd-clarify"
inputs = ["@compliance.report"]
allowed_tools = ["AskUserQuestion"]
isolation = "none"
  [step.schema]
  reviewer_identity = "text"
  rationale = "text"
  evidence_digests = { list = "text" }
  scope = "text"
  expiry = "text"
  follow_up_policy = "text"

[[step]]
id = "release_notes"
type = "subworkflow"
depends_on = ["compliance", "compliance_exception"]
module = "modules/release_notes.toml"
with = { spec_name = "@spec.spec_name", validation_report = "@validate.report", compliance_report = "@compliance.report" }

[[step]]
id = "final_merge_approval"
type = "review"
depends_on = ["release_notes"]
output_type = { enum = ["approve", "reject"] }
  [[step.review]]
  source = "@release_notes.draft"
  label = "Release notes and final merge"

  [[step.review]]
  source = "diff"
  label = "Cumulative implementation diff"
