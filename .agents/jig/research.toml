[workflow]
name = "research"
version = "1"
description = "A producer (structured output) + downstream branching example."

[defaults]
permission_mode = "acceptEdits"

# Producer: schema-enforced structured output via an inline [step.schema].
[[step]]
id            = "research"
type          = "agent"
skill         = "../../examples/skills/research"
inputs        = ["../../examples/question.md"]
allowed_tools = ["Read", "Grep", "Glob", "WebSearch"]

  [step.schema]
  summary    = "text"                                   # human-facing markdown, always present
  status     = { enum = ["complete", "partial", "blocked"] }
  confidence = "number"
  findings   = { list = "text" }
  sources    = { list = { url = "text", relevance = "number" } }

# Downstream producer pulls one field in and guards on another.
[[step]]
id            = "report"
type          = "agent"
depends_on    = ["research"]
skill         = "../../examples/skills/report"
inputs        = ["@research.summary", { ref = "@research.findings", inline = true }]
when          = "research.status == 'complete'"
output        = ".jig/artifacts/report.md"
allowed_tools = ["Read"]

# If research couldn't finish, escalate to a human instead of reporting.
[[step]]
id          = "escalate"
type        = "review"
depends_on  = ["research"]
when        = "research.status == 'blocked'"
review      = "@research.summary"
output_type = { enum = ["retry", "abandon"] }
