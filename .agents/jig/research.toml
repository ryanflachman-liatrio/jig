[workflow]
name = "research"
version = "1"
description = "A producer (structured output) + downstream branching example."

[defaults]
backend         = "claude"
transport       = "sdk"
permission_mode = "acceptEdits"

# Producer: schema-enforced structured output via an inline [step.schema].
[[step]]
id            = "research"
type          = "agent"
skill         = "../skills/research_backend"
inputs        = [
  "templates/context-assess.md",
  { from = "user", label = "Any additional context or focus areas for the review?", as = "user_context" },
]
allowed_tools = ["Read", "Grep", "Glob", "WebSearch"]

  [step.schema]
  state      = { enum = ["complete", "partial", "blocked"] }
  certainty  = "number"
  findings   = { list = "text" }
  sources    = { list = { url = "text", relevance = "number" } }

# Downstream producer pulls one field in and guards on another.
[[step]]
id            = "report"
type          = "agent"
depends_on    = ["research"]
skill         = "../skills/research_frontend"
inputs        = ["@research.summary", { ref = "@research.findings", inline = true }]
when          = "research.state == 'complete'"
output        = ".jig/artifacts/report.md"
allowed_tools = ["Read"]

# If research couldn't finish, escalate to a human instead of reporting.
[[step]]
id          = "escalate"
type        = "review"
depends_on  = ["research"]
when        = "research.state == 'blocked'"
output_type = { enum = ["retry", "abandon"] }
[[step.review]]
source      = "@research.summary"
label       = "Research summary"
