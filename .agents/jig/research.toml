# Run through the TUI: go run ./cmd/jig, then select research.
# Validate: go run ./cmd/jig validate .agents/jig/research.toml
# Agent attempts have deadlines; human review waits do not.
# Revisions revisit only edit -> review, leaving specialist reports intact.
[workflow]
name = "research"
version = "1"
description = "Parallel specialist research, consolidated documents, and bounded human review with a single revision editor."

[defaults]
agent = "@research-default"
max_parallel = 5
max_read_only = 5
resource_limits = { research = 5 }

[[step]]
id = "brief"
type = "agent"
skill = "../skills/research-brief"
depends_on = []
ask_user = true
isolation = "none"
timeout = "20m"
  [[step.inputs]]
  from = "user"
  label = "What should we research? Include the decision to support, project or sources, constraints, and desired depth."
  as = "request"
  once = true

[[step]]
id = "research_codebase"
type = "agent"
agent = "@research-codebase"
skill = "../skills/research-specialist"
depends_on = ["brief"]
inputs = ["@brief"]
isolation = "none"
resource_class = "research"
timeout = "30m"

[[step]]
id = "research_ecosystem"
type = "agent"
agent = "@research-ecosystem"
skill = "../skills/research-specialist"
depends_on = ["brief"]
inputs = ["@brief"]
isolation = "none"
resource_class = "research"
timeout = "30m"

[[step]]
id = "research_contracts"
type = "agent"
agent = "@research-contracts"
skill = "../skills/research-specialist"
depends_on = ["brief"]
inputs = ["@brief"]
isolation = "none"
resource_class = "research"
timeout = "30m"

[[step]]
id = "research_risks"
type = "agent"
agent = "@research-risks"
skill = "../skills/research-specialist"
depends_on = ["brief"]
inputs = ["@brief"]
isolation = "none"
resource_class = "research"
timeout = "30m"

[[step]]
id = "research_validation"
type = "agent"
agent = "@research-validation"
skill = "../skills/research-specialist"
depends_on = ["brief"]
inputs = ["@brief"]
isolation = "none"
resource_class = "research"
timeout = "30m"

# One editor owns all reviewable documents, including specialist revisions.
# Text fields support separate annotated documents without repository writes.
[[step]]
id = "edit"
type = "agent"
skill = "../skills/research-editor"
depends_on = ["brief", "research_codebase", "research_ecosystem", "research_contracts", "research_risks", "research_validation"]
inputs = ["@brief", "@research_codebase", "@research_ecosystem", "@research_contracts", "@research_risks", "@research_validation"]
ask_user = true
isolation = "none"
timeout = "30m"
  [step.context]
  purpose = "Synthesize all reports and address human comments across the document set."
  notes = "On revision, use this run's immutable review-round documents as the baseline; all original reports remain inputs."
  [step.schema]
  synthesis = "text"
  codebase = "text"
  ecosystem = "text"
  contracts = "text"
  risks = "text"
  validation = "text"
  responses = "text"

[[step]]
id = "review"
type = "review"
depends_on = ["edit"]
output_type = { enum = ["approve", "revise"] }
  [[step.review]]
  source = "@edit.synthesis"
  label = "Research synthesis"

  [[step.review]]
  source = "@edit.codebase"
  label = "Codebase and architecture"

  [[step.review]]
  source = "@edit.ecosystem"
  label = "Ecosystem and alternatives"

  [[step.review]]
  source = "@edit.contracts"
  label = "Interfaces and data"

  [[step.review]]
  source = "@edit.risks"
  label = "Security and operations"

  [[step.review]]
  source = "@edit.validation"
  label = "Testing and feasibility"

  [[step.review]]
  source = "@edit.responses"
  label = "Review responses and open questions"

[[step.route]]
when = "review == 'revise'"
goto = "edit"
max_iterations = 5
feedback = "@review"
