[workflow]
name        = "review-ui-demo"
version     = "1"
description = "Deterministic visual fixture for the document review workspace."

# Inspect Markdown in preview and source, then use h/l and 0 on the Go, module,
# and production-sized multi-file diff fixture to verify fixed gutters and
# horizontal panning. In the diff, [ and ] move between hunks while z folds the
# active hunk. Hunk titles expose the changed file and section while source
# gutters are file coordinates; comments remain anchored to raw patch lines.

[[step]]
id          = "review_ui"
type        = "review"
output_type = { enum = ["accept", "revise"] }

[[step.review]]
source = "../../docs/ARCHITECTURE.md"
label  = "Markdown architecture document"

[[step.review]]
source = "../../internal/tui/review/view.go"
label  = "Go source"

[[step.review]]
source = "../../go.mod"
label  = "Plain text / module file"

[[step.review]]
source = "fixtures/review-ui-demo.diff"
label  = "Unified diff fixture"
