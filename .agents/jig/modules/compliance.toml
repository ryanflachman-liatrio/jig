[module]
schema_version = 1

# Module steps resolve defaults before this module is expanded into the parent.
[defaults]
backend = "codex"
transport = "acp"
model = "gpt-5.6-luna"

[module.inputs.spec_name]
type = "text"

[module.inputs.validation_report]
type = "text"

[module.exports.report]
ref = "@assemble.report"

[module.exports.status]
ref = "@assemble.decision"

[[step]]
id = "scope"
type = "agent"
skill = "../../skills/sdd-compliance-scope"
inputs = ["@module.spec_name", "@module.validation_report"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation = "none"
  [step.schema]
  includes_ui = "bool"
  includes_payments = "bool"
  includes_sensitive_data = "bool"

[[step]]
id = "security"
type = "agent"
depends_on = ["scope"]
skill = "../../skills/sdd-check-owasp"
inputs = ["@module.validation_report"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation = "none"
  [step.schema]
  findings = "text"

[[step]]
id = "privacy"
type = "agent"
depends_on = ["scope"]
when = "scope.includes_sensitive_data"
skill = "../../skills/sdd-check-data-privacy"
inputs = ["@module.validation_report"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation = "none"
  [step.schema]
  findings = "text"

[[step]]
id = "accessibility"
type = "agent"
depends_on = ["scope"]
when = "scope.includes_ui"
skill = "../../skills/sdd-check-accessibility"
inputs = ["@module.validation_report"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation = "none"
  [step.schema]
  findings = "text"

[[step]]
id = "dependencies"
type = "agent"
depends_on = ["scope"]
skill = "../../skills/sdd-research-ecosystem"
inputs = ["@module.validation_report"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation = "none"
  [step.schema]
  findings = "text"

[[step]]
id = "assemble"
type = "agent"
depends_on = ["scope", "security", "privacy", "accessibility", "dependencies"]
skill = "../../skills/sdd-assemble-compliance"
inputs = ["@module.spec_name", "@module.validation_report", "@security.findings", "@privacy.findings", "@accessibility.findings", "@dependencies.findings"]
allowed_tools = ["Read", "Write"]
isolation = "worktree"
resource_class = "mutation"
mutation_paths = ["docs/specs/**"]
  [step.schema]
  report = "text"
  decision = { enum = ["pass", "fail", "exception"] }
