# =============================================================================
# SDD Phase 2 (sdd-tasks) as a jig workflow.
#
# Replicates the Liatrio Spec-Driven Development "Generate Task List" phase:
#   spec analysis → parent task generation → human gate (approve/revise loop)
#   → sub-task generation → planning audit → human audit gate (approve/remediate loop)
#
# The two hardest parts of sdd-2 map onto first-class jig constructs:
#   - "Stop and wait for confirmation after parent tasks" → a review gate with a
#     bounded revise loop, so the human can steer the breakdown before sub-tasks.
#   - "Do not continue while REQUIRED gates fail" → a review gate with a bounded
#     remediate loop; the planning_audit agent applies fixes and re-audits in place.
#
# Step mapping to sdd-2:
#   analyze_spec      → Step 1 (internal): spec analysis + standards discovery
#   gen_parent_tasks  → Step 2: parent task generation (writes task file)
#   parent_tasks_review → confirmation gate before sub-tasks
#   gen_subtasks      → Step 3: sub-task expansion + relevant-files table
#   planning_audit    → Step 4: audit gate (writes audit file; applies remediation on loop)
#   audit_review      → audit approval / remediation loop trigger
#
# Validate with:  go run ./cmd/jig validate .agents/jig/sdd-tasks.toml
# =============================================================================

[workflow]
name        = "sdd-tasks"
version     = "1"
description = "SDD Phase 2 — translate a complete spec into an audited task list under docs/specs/."

[defaults]
model           = "claude-opus-4-8"
effort          = "high"
permission_mode = "acceptEdits"
max_parallel    = 1

# ─── 1. Analyze the spec and discover repo standards ─────────────────────────
# Read-only: reads the spec file + AGENTS.md, README.md, CONTRIBUTING.md etc.
# Surfaces the structured analysis and standards evidence that all downstream
# steps depend on.
[[step]]
id            = "analyze_spec"
type          = "agent"
skill         = "../skills/sdd-analyze-spec"
inputs        = [
  { from = "user", label = "Spec name (kebab-case — same name used in sdd-spec, e.g. user-authentication):", as = "spec_name" },
]
allowed_tools = ["Read", "Grep", "Glob"]
isolation     = "none"

  [step.context]
  purpose = "read the spec and surface structured analysis + repo standards for task generation"

  [step.schema]
  spec_name          = "text"
  spec_path          = "text"
  analysis_notes     = "text"
  standards_evidence = { list = { source = "text", status = "text", standards = { list = "text" } } }

# ─── 2. Generate parent tasks ─────────────────────────────────────────────────
# Creates the task file with parent tasks only (sub-tasks are TBD until the
# human confirms). The engine awaits the human gate before proceeding.
# On a revise loop, receives the review feedback and revises the parent tasks.
[[step]]
id            = "gen_parent_tasks"
type          = "agent"
depends_on    = ["analyze_spec"]
skill         = "../skills/sdd-parent-tasks"
inputs        = ["@analyze_spec.spec_name", "@analyze_spec.spec_path", "@analyze_spec.analysis_notes", "@analyze_spec.standards_evidence"]
allowed_tools = ["Read", "Grep", "Glob", "Write"]
isolation     = "none"

  [step.context]
  purpose = "generate 4-6 demoable parent tasks with proof artifacts and write the task file"

  [step.schema]
  task_path    = "text"
  task_summary = "text"

# ─── 3. Human reviews parent tasks ────────────────────────────────────────────
# The "Stop and wait for explicit confirmation" gate from sdd-2 Step 2.
# 'revise' loops back to gen_parent_tasks with the reviewer's feedback;
# 'approve' unblocks sub-task generation.
[[step]]
id           = "parent_tasks_review"
type         = "review"
depends_on   = ["gen_parent_tasks"]
review       = "@gen_parent_tasks.task_summary"
output_type  = { enum = ["approve", "revise"] }
max_messages = 5

  [step.loop]
  when           = "parent_tasks_review == 'revise'"
  goto           = "gen_parent_tasks"
  max_iterations = 3
  feedback       = "@parent_tasks_review"

# ─── 4. Generate sub-tasks and relevant-files table ───────────────────────────
# Only runs after explicit approval. Expands each parent task's TBD section
# and prepends the Relevant Files table.
[[step]]
id            = "gen_subtasks"
type          = "agent"
depends_on    = ["analyze_spec", "gen_parent_tasks", "parent_tasks_review"]
when          = "parent_tasks_review == 'approve'"
skill         = "../skills/sdd-subtasks"
inputs        = ["@analyze_spec.spec_path", "@analyze_spec.spec_name", "@gen_parent_tasks.task_path"]
allowed_tools = ["Read", "Grep", "Glob", "Write", "Edit"]
isolation     = "none"

  [step.context]
  purpose = "expand each parent task into actionable sub-tasks and add a relevant-files table"

  [step.schema]
  task_path = "text"

# ─── 5. Planning audit gate ────────────────────────────────────────────────────
# Runs all REQUIRED audit gates and writes the audit report. On a remediate
# loop, applies the human-approved fixes to the task file and re-audits.
# The engine blocks progression on 'fail' until the human triggers remediation
# or approves the audit through the gate below.
[[step]]
id            = "planning_audit"
type          = "agent"
depends_on    = ["analyze_spec", "gen_subtasks"]
skill         = "../skills/sdd-audit"
inputs        = ["@analyze_spec.spec_path", "@analyze_spec.spec_name", "@gen_subtasks.task_path", "@analyze_spec.standards_evidence"]
allowed_tools = ["Read", "Grep", "Glob", "Write", "Edit"]
isolation     = "none"

  [step.context]
  purpose = "evaluate all REQUIRED planning audit gates and write the audit report; on a loop run, apply remediation then re-audit"

  [step.schema]
  audit_path       = "text"
  gate_status      = { enum = ["pass", "fail"] }
  findings_summary = "text"

# ─── 6. Human reviews audit findings ──────────────────────────────────────────
# Renders the audit report. 'remediate' loops back to planning_audit with the
# human's feedback; the planning_audit agent applies edits and re-audits.
# 'approve' signals the workflow is ready for Phase 3 (sdd-implement).
[[step]]
id           = "audit_review"
type         = "review"
depends_on   = ["planning_audit"]
review       = "@planning_audit.findings_summary"
output_type  = { enum = ["approve", "remediate"] }
max_messages = 10

  [step.loop]
  when           = "audit_review == 'remediate'"
  goto           = "planning_audit"
  max_iterations = 3
  feedback       = "@audit_review"
