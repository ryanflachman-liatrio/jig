# =============================================================================
# SDD Phase 1 (sdd-1) as a jig workflow.
#
# Replicates the Liatrio Spec-Driven Development "Generate Specification" phase:
#   idea → context assessment → tech research → scope check → clarification gate
#   (with question rounds) → write spec → review-and-refine — as an inspectable DAG.
#
# Step mapping to sdd-1:
#   mkdir_spec            → Step 1: Create spec directory
#   context_assess        → Step 2a: Context assessment (codebase only) [Haiku]
#   research_security     → Step 2b: Security standards research [Sonnet, parallel]
#   research_api_contracts → Step 2b: API contract standards research [Sonnet, parallel]
#   research_data_patterns → Step 2b: Data pattern research [Sonnet, parallel]
#   research_testing_standards → Step 2b: Testing standards research [Sonnet, parallel]
#   research_ecosystem    → Step 2b: Ecosystem health research [Sonnet, parallel]
#   synthesize_research   → Step 2c: Merge parallel research findings [Haiku]
#   scope_assess          → Step 3: Initial scope assessment [Haiku]
#   scope_gate            → Step 3: "ALWAYS pause" human gate (fires only when off-size)
#   clarify               → Step 4: Clarification sufficiency check + question rounds [Opus]
#   write_spec            → Step 5: Spec generation [Opus]
#   spec_review           → Step 6: Review and refinement loop
#
# Validate with:  go run ./cmd/jig validate .agents/jig/sdd-spec.toml
# =============================================================================

[workflow]
name        = "sdd-spec"
version     = "1"
description = "SDD Phase 1 — turn an idea into a validated spec under docs/specs/."

[defaults]
model           = "claude-opus-4-8"
effort          = "high"
permission_mode = "acceptEdits"
max_parallel    = 5

# ─── 1. Create the spec directory (deterministic; sdd-1 Step 1) ───────────────
[[step]]
id   = "mkdir_spec"
type = "command"
run  = "mkdir -p docs/specs"

# ─── 2a. Context assessment (sdd-1 Step 2a) ───────────────────────────────────
# Reads the codebase and docs; no web search. Surfaces the technologies list
# that the research fan-out uses to know what to look up.
[[step]]
id              = "context_assess"
type            = "agent"
backend         = "cursor"
transport       = "acp"
model           = "claude-haiku-4-5-20251001"
depends_on      = ["mkdir_spec"]
skill           = "../skills/sdd-context-assess"
output_template = "templates/context-assess.md"
inputs          = [
  { from = "user", label = "Describe the feature to spec (paste any reference material):", as = "request" },
  { from = "user", label = "What should this spec be called? (kebab-case, e.g. user-authentication):", as = "spec_name" },
]
allowed_tools = ["Read", "Grep", "Glob"]
isolation     = "none"

  [step.context]
  purpose = "ground the spec in the real codebase and surface technologies for research"

  [step.schema]
  spec_name      = "text"
  technologies   = { list = "text" }
  repo_standards = { list = "text" }

# ─── 2b. Parallel domain research (sdd-1 Step 2b — fan-out) ──────────────────
# Five focused researchers run in parallel, each covering one concern lane.
# synthesize_research (2c) merges findings and surfaces cross-domain tensions.

[[step]]
id            = "research_security"
type          = "agent"
model         = "claude-sonnet-4-6"
depends_on    = ["context_assess"]
skill         = "../skills/sdd-research-security"
inputs        = ["@context_assess.summary", "@context_assess.technologies"]
allowed_tools = ["WebSearch", "WebFetch"]
isolation     = "none"

  [step.context]
  purpose = "research current security standards, auth patterns, and CVE landscape for the identified tech stack"

  [step.schema]
  findings       = { list = { technology = "text", source = "text", recency = "text", practice = "text", tension = "text" } }
  domain_summary = "text"

[[step]]
id            = "research_api_contracts"
type          = "agent"
model         = "claude-sonnet-4-6"
depends_on    = ["context_assess"]
skill         = "../skills/sdd-research-api-contracts"
inputs        = ["@context_assess.summary", "@context_assess.technologies"]
allowed_tools = ["WebSearch", "WebFetch"]
isolation     = "none"

  [step.context]
  purpose = "research current API design standards, versioning strategies, and contract patterns"

  [step.schema]
  findings       = { list = { technology = "text", source = "text", recency = "text", practice = "text", tension = "text" } }
  domain_summary = "text"

[[step]]
id            = "research_data_patterns"
type          = "agent"
model         = "claude-sonnet-4-6"
depends_on    = ["context_assess"]
skill         = "../skills/sdd-research-data-patterns"
inputs        = ["@context_assess.summary", "@context_assess.technologies"]
allowed_tools = ["WebSearch", "WebFetch"]
isolation     = "none"

  [step.context]
  purpose = "research current data modeling, ORM, migration, and caching patterns"

  [step.schema]
  findings       = { list = { technology = "text", source = "text", recency = "text", practice = "text", tension = "text" } }
  domain_summary = "text"

[[step]]
id            = "research_testing_standards"
type          = "agent"
model         = "claude-sonnet-4-6"
depends_on    = ["context_assess"]
skill         = "../skills/sdd-research-testing-standards"
inputs        = ["@context_assess.summary", "@context_assess.technologies"]
allowed_tools = ["WebSearch", "WebFetch"]
isolation     = "none"

  [step.context]
  purpose = "research current testing frameworks, coverage standards, and contract testing patterns"

  [step.schema]
  findings       = { list = { technology = "text", source = "text", recency = "text", practice = "text", tension = "text" } }
  domain_summary = "text"

[[step]]
id            = "research_ecosystem"
type          = "agent"
model         = "claude-sonnet-4-6"
depends_on    = ["context_assess"]
skill         = "../skills/sdd-research-ecosystem"
inputs        = ["@context_assess.summary", "@context_assess.technologies"]
allowed_tools = ["WebSearch", "WebFetch"]
isolation     = "none"

  [step.context]
  purpose = "research current library versions, deprecations, ecosystem health, and dependency direction"

  [step.schema]
  findings       = { list = { technology = "text", source = "text", recency = "text", practice = "text", tension = "text" } }
  domain_summary = "text"

# ─── 2c. Synthesize parallel research findings ────────────────────────────────
# Merges the five domain findings into unified research_notes and a summary
# paragraph that calls out cross-domain tensions. Scope, clarify, and write_spec
# all consume @synthesize_research.summary — same interface as the old
# tech_research step.
[[step]]
id            = "synthesize_research"
type          = "agent"
model         = "claude-haiku-4-5-20251001"
depends_on    = ["research_security", "research_api_contracts", "research_data_patterns", "research_testing_standards", "research_ecosystem"]
skill         = "../skills/sdd-synthesize-research"
inputs        = [
  "@research_security.findings",
  "@research_security.domain_summary",
  "@research_api_contracts.findings",
  "@research_api_contracts.domain_summary",
  "@research_data_patterns.findings",
  "@research_data_patterns.domain_summary",
  "@research_testing_standards.findings",
  "@research_testing_standards.domain_summary",
  "@research_ecosystem.findings",
  "@research_ecosystem.domain_summary",
]
allowed_tools = []
isolation     = "none"

  [step.context]
  purpose = "merge five parallel domain research reports into a unified summary with cross-domain tensions surfaced"

  [step.schema]
  research_notes = { list = { technology = "text", source = "text", recency = "text", practice = "text", tension = "text" } }

# ─── 3. Scope assessment (sdd-1 Step 3) ───────────────────────────────────────
# Receives both codebase and research summaries so tech complexity informs sizing.
[[step]]
id            = "scope_assess"
type          = "agent"
model         = "claude-haiku-4-5-20251001"
depends_on    = ["context_assess", "synthesize_research"]
skill         = "../skills/sdd-scope-assess"
inputs        = ["@context_assess.summary", "@synthesize_research.summary"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation     = "none"

  [step.schema]
  sizing    = { enum = ["too_large", "too_small", "just_right"] }
  rationale = "text"

# ─── 4. Scope gate — fires ONLY when sizing is off (sdd-1 "ALWAYS pause") ──────
[[step]]
id           = "scope_gate"
type         = "review"
depends_on   = ["scope_assess"]
when         = "scope_assess.sizing != 'just_right'"
review       = "@scope_assess.summary"
output_type  = { enum = ["proceed", "narrow"] }
max_messages = 5

  [step.loop]
  when           = "scope_gate == 'narrow'"
  goto           = "scope_assess"
  max_iterations = 3
  feedback       = "@scope_gate"

# ─── 5. Clarification gate + question rounds (sdd-1 Step 4) ───────────────────
[[step]]
id            = "clarify"
type          = "agent"
depends_on    = ["context_assess", "synthesize_research", "scope_assess", "scope_gate"]
skill         = "../skills/sdd-clarify"
inputs        = ["@context_assess.summary", "@synthesize_research.summary", "@scope_assess.summary", "@context_assess.spec_name"]
allowed_tools = ["Read", "Grep", "Glob", "Write", "Bash"]
block_on      = "clarify.sufficiency == 'insufficient'"
isolation     = "none"

  [step.schema]
  sufficiency = { enum = ["sufficient", "insufficient"] }
  questions   = { list = { topic = "text", options = { list = "text" }, recommended = "text" } }

# ─── 6. Generate the spec (sdd-1 Step 5) ──────────────────────────────────────
[[step]]
id            = "write_spec"
type          = "agent"
depends_on    = ["context_assess", "synthesize_research", "clarify"]
skill         = "../skills/sdd-write-spec"
inputs        = ["@context_assess.summary", "@synthesize_research.summary", "@clarify.summary", "@context_assess.spec_name"]
allowed_tools = ["Read", "Grep", "Glob", "Write", "Edit", "Bash"]
isolation     = "none"

  [step.schema]
  spec_path    = "text"
  spec_content = "text"

  [step.validate]
  command = "find docs/specs -name '*.md' -not -name 'questions.md' | xargs grep -l '## Demoable Units of Work' | xargs grep -l '## Non-Goals' | grep -q ."

# ─── 7. Review & refine until satisfied (sdd-1 Step 6) ─────────────────────────
[[step]]
id           = "spec_review"
type         = "review"
depends_on   = ["write_spec"]
review       = "@write_spec.spec_content"
output_type  = { enum = ["approve", "revise"] }
max_messages = 10

  [step.loop]
  when           = "spec_review == 'revise'"
  goto           = "write_spec"
  max_iterations = 5
  feedback       = "@spec_review"
