# =============================================================================
# agent_file + model/reasoning knobs example.
#
# Shows:
#   - an `agent` step driven by a Claude agent file (`agent_file`) instead of a
#     skill dir — its frontmatter tools/model and body prompt fold into the step
#   - the model/reasoning knobs: effort, fallback_model, max_thinking_tokens,
#     max_budget_usd, plus a disallowed_tools denylist and append_system_prompt
#
# Validate it with:  jig validate examples/review.toml
# =============================================================================

[workflow]
name        = "review"
version     = "1"
description = "Security review driven by a Claude agent file."

[defaults]
model               = "claude-opus-4-8"
fallback_model      = "claude-sonnet-4-6"
effort              = "high"
max_turns           = 20
max_thinking_tokens = 8000
max_budget_usd      = 5.0
permission_mode     = "acceptEdits"

# The reviewer's prompt, tools, and model come from the agent file. We add a
# per-step instruction and tighten reasoning/cost just for this step.
[[step]]
id                   = "review"
type                 = "agent"
agent_file           = "../../examples/agents/security-reviewer.md"
profile              = "@interactive"
inputs               = [
  "../../examples/request.md",
  { from = "user", label = "Any additional context or focus areas for the review?", as = "user_context" },
]
disallowed_tools     = ["Bash"]
append_system_prompt = "Only report high and critical severity findings."
effort               = "max"
max_budget_usd       = 2.0

  [step.schema]
  summary = "text"
  passed  = "bool"
  issues  = { list = { severity = { enum = ["high", "critical"] }, detail = "text" } }

# Human gate on the verdict.
[[step]]
id          = "sign_off"
type        = "review"
depends_on  = ["review"]
when        = "review.passed == 'false'"
review      = "@review.summary"
output_type = { enum = ["waive", "block"] }
