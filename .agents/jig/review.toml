# =============================================================================
# agent_file + model/reasoning knobs example.
#
# Shows:
#   - an `agent` step driven by a Claude agent file (`agent_file`) instead of a
#     skill dir — its frontmatter tools/model and body prompt fold into the step
#   - a Claude [step.agent] with effort, fallback_model, max_thinking_tokens,
#     max_budget_usd and a disallowed_tools denylist, plus append_system_prompt
#
# Validate it with:  jig validate .agents/jig/review.toml
# =============================================================================

[workflow]
name        = "review"
version     = "1"
description = "Security review driven by a Claude agent file."

# The step's agent carries the model, reasoning and cost limits. It keeps all
# built-in tools except Bash and runs in place.
[[step]]
id                   = "review"
type                 = "agent"
skill                = "../skills/research_backend"
ask_user             = true
isolation            = "none"
inputs               = [
  "templates/context-assess.md",
  { from = "user", label = "Any additional context or focus areas for the review?", as = "user_context" },
]
append_system_prompt = "Only report high and critical severity findings."

  [step.agent]
  model               = "claude-opus-4-8"
  fallback_model      = "claude-sonnet-4-6"
  effort              = "max"
  max_turns           = 20
  max_thinking_tokens = 8000
  max_budget_usd      = 2.0
  permission_mode     = "acceptEdits"
  disallowed_tools    = ["Bash"]

  [step.schema]
  passed  = "bool"

# Human gate on the verdict.
[[step]]
id          = "sign_off"
type        = "review"
depends_on  = ["review"]
when        = "review.passed == 'false'"
output_type = { enum = ["waive", "block"] }
[[step.review]]
source      = "@review.summary"
label       = "Security review summary"
