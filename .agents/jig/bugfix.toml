[workflow]
name = "bugfix"
version = "1"

[defaults]
permission_mode = "acceptEdits"

[[step]]
id            = "triage"
type          = "agent"
skill         = "skills/triage"
inputs        = ["reports/bug-1234.md"]
output        = ".jig/artifacts/triage.md"
allowed_tools = ["Read", "Grep", "Glob"]

[[step]]
id            = "fix"
type          = "agent"
depends_on    = ["triage"]
skill         = "skills/fix"
inputs        = ["@triage"]
allowed_tools = ["Read", "Edit", "Write", "Bash"]

  [step.validate]
  command = "go test ./..."

[[step]]
id          = "approve"
type        = "review"
depends_on  = ["fix"]
review      = "diff"
output_type = { enum = ["approve", "revise"] }

  [step.loop]
  when           = "approve == 'revise'"
  goto           = "fix"
  max_iterations = 3
  feedback       = "@approve"

[[step]]
id         = "merge"
type       = "command"
depends_on = ["approve"]
when       = "approve == 'approve'"
run        = "git merge --no-ff jig/bugfix/fix"
