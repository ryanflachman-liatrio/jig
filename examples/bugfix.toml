[workflow]
name = "bugfix"
version = "1"

[defaults]
permission_mode = "acceptEdits"

[[step]]
id            = "triage"
type          = "agent"
skill         = "skills/triage"
inputs        = ["reports/bug-1234.md"]
output        = ".jig/artifacts/triage.md"
allowed_tools = ["Read", "Grep", "Glob"]

[[step]]
id            = "fix"
type          = "agent"
depends_on    = ["triage"]
skill         = "skills/fix"
inputs        = ["@triage"]
allowed_tools = ["Read", "Edit", "Write", "Bash"]

  [step.validate]
  command = "go test ./..."

[[step]]
id          = "approve"
type        = "review"
depends_on  = ["fix"]
review      = "diff"
output_type = { enum = ["approve", "revise"] }

  [step.loop]
  when           = "approve == 'revise'"
  goto           = "fix"
  max_iterations = 3
  feedback       = "@approve"

# Landing the change is no longer a hand-wired `merge` command step: jig runs each
# step on a per-run integration branch and presents a single final-merge gate at
# run end (spec 06 A3), so approving the review and then the final-merge gate lands
# the run onto the working branch.
