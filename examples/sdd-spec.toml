# =============================================================================
# SDD Phase 1 (sdd-1) as a jig workflow.
#
# Replicates the Liatrio Spec-Driven Development "Generate Specification" phase:
#   idea → context assessment → scope check → clarification gate (with question
#   rounds) → write spec → review-and-refine — as an inspectable DAG.
#
# The sdd skill recovers deterministic orchestration on top of a stateless
# invocation via a SKILL.md router + assess-sdd-state.py. jig makes that
# machinery unnecessary: the graph IS the router, phase transitions ARE edges,
# and run state is held by the engine. The two most delicate parts of sdd-1 map
# onto first-class jig constructs:
#   - the "Clarification status: sufficient/insufficient" declaration → a typed
#     producer verdict (`[step.schema]` enum) instead of a prose honor-system;
#   - the questions-file "STOP AND WAIT → read answers → re-check" round-trip →
#     block_on (engine-enforced pause + same-session resume, bounded cap).
#
# Validate with:  go run ./cmd/jig validate examples/sdd-spec.toml
# =============================================================================

[workflow]
name        = "sdd-spec"
version     = "1"
description = "SDD Phase 1 — turn an idea into a validated spec under docs/specs/."

[defaults]
model           = "claude-opus-4-8"
effort          = "high"
permission_mode = "acceptEdits"
max_parallel    = 2

# ─── 1. Create the spec directory (deterministic; sdd-1 Step 1) ───────────────
[[step]]
id   = "mkdir_spec"
type = "command"
run  = "mkdir -p docs/specs"

# ─── 2. Context assessment + latest-standards research (sdd-1 Steps 2) ────────
# The "if the user gave no input, ask for it" rule becomes a from="user" input:
# the engine pauses and prompts before the step runs. Read-only, so no worktree.
[[step]]
id            = "context"
type          = "agent"
depends_on    = ["mkdir_spec"]
skill         = "skills/sdd-context"
inputs        = [{ from = "user", label = "Describe the feature to spec (paste any reference material):", as = "request" }]
allowed_tools = ["Read", "Grep", "Glob", "WebSearch", "WebFetch"]
isolation     = "none"

  [step.context]
  purpose = "ground the spec in the real codebase and current standards"

  # `summary` and `status` are provided automatically by the base schema on every
  # agent step, so only the extra fields are declared here.
  [step.schema]
  repo_standards = { list = "text" }
  research_notes = { list = { technology = "text", source = "text", practice = "text" } }

# ─── 3. Scope assessment (sdd-1 Step 3) ───────────────────────────────────────
# The too_large/too_small/just_right judgment becomes a constrained enum verdict.
[[step]]
id            = "scope"
type          = "agent"
depends_on    = ["context"]
skill         = "skills/sdd-scope"
inputs        = ["@context.summary"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation     = "none"

  [step.schema]
  sizing    = { enum = ["too_large", "too_small", "just_right"] }
  rationale = "text"

# ─── 4. Scope gate — fires ONLY when sizing is off (sdd-1 "ALWAYS pause") ──────
# just_right skips this node and flows straight on. Otherwise a human decides
# whether to proceed or narrow; "narrow" loops back to re-assess with feedback.
[[step]]
id           = "scope_gate"
type         = "review"
depends_on   = ["scope"]
when         = "scope.sizing != 'just_right'"
review       = "@scope.summary"
output_type  = { enum = ["proceed", "narrow"] }
max_messages = 5

  [step.loop]
  when           = "scope_gate == 'narrow'"
  goto           = "scope"
  max_iterations = 3
  feedback       = "@scope_gate"

# ─── 5. Clarification gate + question rounds (sdd-1 Step 4 — the heart) ────────
# block_on parks the step whenever the agent declares itself insufficient; the
# TUI opens a compose box, the human answers, and the agent resumes the SAME
# session and re-runs the sufficiency check. Bounded by the engine's 20-round cap
# — the exact "STOP AND WAIT → read answers → re-check" loop, engine-enforced.
[[step]]
id            = "clarify"
type          = "agent"
depends_on    = ["context", "scope"]
skill         = "skills/sdd-clarify"
inputs        = ["@context.summary", "@scope.summary"]
allowed_tools = ["Read", "Grep", "Glob", "Write"]
block_on      = "clarify.sufficiency == 'insufficient'"
isolation     = "none"

  # `status` is reserved (execution disposition), so the domain verdict gets its
  # own field. This is a nice tell: jig separates "did the step run" (base status)
  # from "is the context sufficient" (a declared verdict) — two things sdd-1's
  # prose "Clarification status" declaration conflates.
  [step.schema]
  sufficiency = { enum = ["sufficient", "insufficient"] }
  questions   = { list = { topic = "text", options = { list = "text" }, recommended = "text" } }

# ─── 6. Generate the spec (sdd-1 Step 5) ──────────────────────────────────────
# Reachable only once clarify is sufficient. The "use the EXACT structure" rule
# becomes a deterministic [step.validate] gate: dependents wait until the
# mandatory sections exist. See NOTE below on the static output path.
[[step]]
id            = "write_spec"
type          = "agent"
depends_on    = ["context", "clarify"]
skill         = "skills/sdd-write-spec"
inputs        = ["@context.summary", "@clarify.summary"]
allowed_tools = ["Read", "Grep", "Glob", "Write", "Edit"]
output        = "docs/specs/spec.md"
isolation     = "none"

  [step.validate]
  command = "grep -q '## Demoable Units of Work' docs/specs/spec.md && grep -q '## Non-Goals' docs/specs/spec.md && grep -q '## Proof Artifacts\\|Proof Artifacts:' docs/specs/spec.md"

# ─── 7. Review & refine until satisfied (sdd-1 Step 6) ─────────────────────────
# The human reviews the rendered spec, may send follow-up messages, and either
# approves or sends it back. "revise" loops to write_spec with the feedback as an
# input — the bounded equivalent of "iterate based on feedback until satisfied."
[[step]]
id           = "spec_review"
type         = "review"
depends_on   = ["write_spec"]
review       = "@write_spec"
output_type  = { enum = ["approve", "revise"] }
max_messages = 10

  [step.loop]
  when           = "spec_review == 'revise'"
  goto           = "write_spec"
  max_iterations = 5
  feedback       = "@spec_review"

# NOTE — dynamic spec path is a real schema gap. sdd-1 writes to
# docs/specs/[NN]-spec-[feature-name]/[NN]-spec-[feature-name].md, computed at
# runtime. jig's `output` is a static string with no way to inject a name derived
# by an upstream step (unlike worktree branches, which are by convention). So
# this example uses a fixed docs/specs/spec.md; a real port would either let the
# agent name the file itself (losing precise output/validate references) or need
# a variable-injection feature jig does not yet have.
