# =============================================================================
# Kitchen-sink example — end-to-end feature-delivery pipeline.
#
# Exercises every construct jig supports today:
#   - all three step types: agent / command / review
#   - all [defaults] fields: fallback_model, effort, max_thinking_tokens,
#     max_budget_usd, cwd; per-step overrides on intake
#   - parallelism (fan-out) and joins (fan-in), derived from depends_on
#   - producer agents with structured output via schema_file (intake) and
#     [step.schema] (all others): text / number / bool / enum / list /
#     list-of-object / nested enum
#   - agent_file step (security_scan) — a Claude agent .md file instead of
#     a skill directory; shows the bundled (prompt, tools, model) triple
#   - append_system_prompt — per-step system-prompt addendum (research_backend)
#   - disallowed_tools — tool denylist (research_frontend)
#   - block_on — agent self-pauses when its own output field is true, surfacing
#     a TUI compose box so the human can answer before the agent re-runs (security_scan)
#   - from="user" inputs — engine pauses and prompts the human before the step
#     runs; answers are injected into the agent context (plan)
#   - output — explicit markdown artifact from an agent step (plan)
#   - isolation = "none" — explicit worktree opt-out on read-only steps
#   - output_type = "bool" on a review step (security_review)
#   - max_messages — human can send follow-up messages to the reviewed agent
#     before giving a final verdict (plan_review, final_review)
#   - scalar enum output_type verdicts on review steps
#   - field references: @step.field inputs and step.field guards
#   - three bounded loops: human revise loop on plan, automated QA loop on implement
#   - deterministic gates ([step.validate]) and on_failure policies
#   - inline inputs, worktree isolation, and [defaults] inheritance
#
# ─── FEATURES NOT YET IN THE SCHEMA ─────────────────────────────────────────
#   Listed here to prompt future design; each entry is a real gap in the current
#   schema that either adds friction to workflow authors or is impossible to express.
#
#   1. output_type = "text" for review steps.  Today review steps require bool or
#      enum; a text output_type would let the human type an open-ended answer that
#      a downstream agent step receives as a field ref. Needed for "Claude asks a
#      question, human answers in prose" patterns that don't fit a fixed choice set.
#
#   2. Compound boolean guards (AND / OR).  when = "a == 'x' and b == 'y'" is not
#      yet supported — only one condition is allowed. This forces serial gate
#      workarounds (e.g., chaining review steps) instead of expressing intent
#      directly. See the security_review → final_review chain below for an example.
#
#   3. Dynamic fan-out / map steps.  Run N parallel agent instances over each
#      element of a producer's list field, e.g. one implement step per task in
#      @plan.tasks. Deferred because N is unknown at parse time, which breaks
#      static @ref validation and guard type-checking.
#
#   4. Named step timeouts.  A per-step wall-clock ceiling (timeout = "10m")
#      separate from max_turns. Essential for hung shell commands or runaway
#      agents that loop without advancing.
#
#   5. Retry with exponential backoff.  on_failure = "retry" re-runs immediately.
#      A backoff table (initial, multiplier, max) would handle transient API /
#      network failures more gracefully than hammering at once.
#
#   6. Step tags for selective execution.  tags = ["slow", "network"] and
#      `jig run --skip slow` or `jig run --only lint` for debugging and cost
#      control without editing the workflow file.
#
#   7. Multi-approver review.  approvers = ["security-team", "product"] requiring
#      multiple human verdicts (from named roles) before a step passes.
#
#   8. Event hooks.  Fire an HTTP POST or run a shell command on step events
#      (completed, failed, awaiting_review) without adding notification steps to the
#      DAG. Natural integration point for Slack, PagerDuty, or CI systems.
#
#   9. Secrets injection.  env = { TOKEN = "secret:github/token" } resolved from a
#      keychain or vault at runtime, without baking sensitive values into the TOML
#      or the agent's environment by default.
#
#  10. Checkpoint / resume.  `jig resume <run-id>` picks up from the last completed
#      step instead of re-running the entire workflow. Essential when a late step
#      fails after hours of upstream agent work.
#
# ─── UNDOCUMENTED (implemented but absent from workflow-schema.md) ─────────
#   - block_on: agent-step field whose condition (referencing the step's own schema
#     output) is checked after each run; if true the step parks in StatusNeedsInput
#     and the TUI offers a compose box. The agent re-runs with the human's response
#     as the query. Bounded by a hard cap of 20 input rounds per step.
#   - max_messages: review-step field capping how many times the human can message
#     the reviewed agent (which re-runs after each message) before giving the final
#     verdict. Default is 10 when omitted.
#
# Validate with:  jig validate examples/feature.toml
# =============================================================================

[workflow]
name        = "feature"
version     = "1"
description = "Research → plan → implement → verify → ship, with review gates and loops."

[defaults]
model               = "claude-opus-4-8"
fallback_model      = "claude-sonnet-4-6"   # used when the primary model is overloaded or rate-limited
effort              = "high"                 # low | medium | high | xhigh | max
max_turns           = 40
max_thinking_tokens = 8000
max_budget_usd      = 5.0                    # per-step cost ceiling; engine aborts the step when exceeded
cwd                 = "."
permission_mode     = "acceptEdits"
max_parallel        = 3
artifacts_dir       = ".jig/artifacts"

# ─── 1. Intake ───────────────────────────────────────────────────────────────
# Classifies the request and extracts the areas to research.
# Shows: schema_file, inline input, per-step effort + max_budget_usd overrides.
[[step]]
id             = "intake"
type           = "agent"
skill          = "skills/intake"
inputs         = ["request.md", { path = "conventions.md", inline = true }]
schema_file    = "schemas/intake.json"
allowed_tools  = ["Read", "Grep", "Glob"]
effort         = "medium"      # override [defaults] "high" — triage is cheap
max_budget_usd = 1.0           # tighter ceiling for this lightweight step
block_on       = "intake.status == 'blocked'"  # pause and ask the user when the request is ambiguous

# ─── 2–3. Research (parallel fan-out) ───────────────────────────────────────
# Two producer agents fan out once intake finishes; they share the research skill
# but are tuned differently with per-step overrides.
#
# Shows (backend): append_system_prompt narrows the agent's focus without
#   touching the shared skill file.
# Shows (frontend): disallowed_tools as a belt-and-suspenders denylist to
#   ensure a read-only step never runs shell commands.
[[step]]
id                   = "research_backend"
type                 = "agent"
depends_on           = ["intake"]
when                 = "intake.status == 'succeeded'"
skill                = "skills/research"
inputs               = ["@intake.areas"]
allowed_tools        = ["Read", "Grep", "Glob", "WebSearch"]
append_system_prompt = "Focus on backend concerns only: data models, API contracts, storage, and service boundaries. Ignore frontend and UI details."
block_on             = "research_backend.status == 'blocked'"

  [step.schema]
  findings = { list = "text" }
  sources  = { list = { url = "text", relevance = "number" } }

[[step]]
id               = "research_frontend"
type             = "agent"
depends_on       = ["intake"]
when             = "intake.status == 'succeeded'"
skill            = "skills/research"
inputs           = ["@intake.areas"]
allowed_tools    = ["Read", "Grep", "Glob", "WebSearch"]
disallowed_tools = ["Bash"]    # belt-and-suspenders: this read-only step must never run shell commands
block_on         = "research_frontend.status == 'blocked'"

  [step.schema]
  findings = { list = "text" }
  sources  = { list = { url = "text", relevance = "number" } }

# ─── 4. Security scan ────────────────────────────────────────────────────────
# Runs in parallel with research; reads intake areas and flags security concerns.
#
# Shows: agent_file (a bundled prompt/tools/model triple from a .md file instead
#   of a skill directory); tools and model are folded in from the file when the
#   step leaves them unset.
# Shows: isolation = "none" explicit opt-out — read-only, no worktree needed.
# Shows: block_on — the agent sets needs_input = true in its schema output when
#   it needs human clarification (e.g. to confirm the threat model). The engine
#   parks the step and the TUI opens a compose box; the human's answer becomes
#   the agent's next query. Repeats until needs_input is false or the 20-round cap.
[[step]]
id         = "security_scan"
type       = "agent"
depends_on = ["intake"]
when       = "intake.status == 'succeeded'"
agent_file = "agents/security-reviewer.md"
inputs     = ["@intake.areas"]
isolation  = "none"                    # explicit: read-only analysis, no mutation
block_on   = "security_scan.needs_input"

  [step.schema]
  passed      = "bool"
  needs_input = "bool"     # set true by the agent when it has a question for the human
  question    = "text"     # surfaced in the TUI compose box when needs_input is true
  risk_level  = { enum = ["none", "low", "medium", "high", "critical"] }
  findings    = { list = { title = "text", severity = { enum = ["low", "medium", "high", "critical"] }, file = "text", detail = "text" } }

# ─── 5. Plan (join) ─────────────────────────────────────────────────────────
# Waits for all three parallel steps, then synthesises an implementation plan.
#
# Shows: join across three producers; @stepid.field inputs pulling a single field
#   from each upstream producer's JSON artifact.
# Shows: from="user" input — before this step runs the engine pauses and asks the
#   human the given label; the answer is injected into the agent context under
#   the `as` name. Multiple from="user" entries are collected sequentially.
# Shows: output — an explicit markdown file written by the agent (in addition to
#   the schema-enforced JSON artifact). plan_review renders @plan.summary (a
#   field), while the TUI can also open plan.md as a raw file.
[[step]]
id            = "plan"
type          = "agent"
depends_on    = ["research_backend", "research_frontend", "security_scan"]
skill         = "skills/plan"
inputs        = [
  "@research_backend.summary",
  "@research_frontend.summary",
  "@security_scan.summary",
  { from = "user", label = "Any constraints or priorities for the implementation? (leave blank if none)", as = "constraints" },
]
allowed_tools = ["Read", "Grep", "Glob"]
output        = ".jig/artifacts/plan.md"

  [step.schema]
  approach = "text"
  risk     = { enum = ["low", "medium", "high"] }
  tasks    = { list = { title = "text", area = "text", estimate = "number" } }

# ─── 6. Plan review ─────────────────────────────────────────────────────────
# Human gate before implementation begins.
#
# Shows: max_messages — the human may send up to 5 free-text messages to the
#   plan agent (which re-runs with each message) before giving the final verdict.
#   This is the primary "human responds to agent questions" mechanism: the agent
#   can end its turn with an open question in the summary, the human replies via
#   the TUI, and the agent continues with that context. AllowMessage is set by the
#   engine when the reviewed step is an agent step.
# Shows: [step.loop] re-runs plan with reviewer notes fed back as context.
[[step]]
id           = "plan_review"
type         = "review"
depends_on   = ["plan"]
review       = "@plan.summary"
output_type  = { enum = ["approve", "revise"] }
max_messages = 5

  [step.loop]
  when           = "plan_review == 'revise'"
  goto           = "plan"
  max_iterations = 3
  feedback       = "@plan_review"

# ─── 7. Implement ────────────────────────────────────────────────────────────
# The only mutating agent. worktree isolation is on by default for Edit/Write/Bash.
# Shows: isolation = "worktree" explicit; { ref = "@...", inline = true } to embed
#   a field's text directly into the agent's system prompt rather than as a file.
[[step]]
id            = "implement"
type          = "agent"
depends_on    = ["plan_review", "plan"]
when          = "plan_review == 'approve'"
skill         = "skills/implement"
inputs        = ["@plan.tasks", { ref = "@plan.approach", inline = true }]
isolation     = "worktree"
allowed_tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash"]

# ─── 8–10. Checks (parallel fan-out off implement) ──────────────────────────
# Three deterministic command steps fan out; lint is advisory, unit_test retries.
# Shows: on_failure = "continue" (lint advisory); "retry" + max_retries (unit_test);
#   [step.validate] with command + output_exists.
[[step]]
id         = "lint"
type       = "command"
depends_on = ["implement"]
run        = "golangci-lint run ./..."
on_failure = "continue"

[[step]]
id         = "typecheck"
type       = "command"
depends_on = ["implement"]
run        = "go build ./..."

[[step]]
id          = "unit_test"
type        = "command"
depends_on  = ["implement"]
script      = "scripts/test.sh"
output      = "test-report.txt"
on_failure  = "retry"
max_retries = 2

  [step.validate]
  command       = "go test ./..."
  output_exists = true

# ─── 11. QA ─────────────────────────────────────────────────────────────────
# Producer validation agent joining all three checks. Read-only: no worktree.
# Shows: isolation = "none" explicit; [step.loop] auto-retries implement when
#   QA finds failures, feeding its findings back as structured context.
[[step]]
id            = "qa"
type          = "agent"
depends_on    = ["lint", "typecheck", "unit_test"]
skill         = "skills/qa"
inputs        = ["@unit_test"]
allowed_tools = ["Read", "Grep", "Glob"]
isolation     = "none"

  [step.schema]
  passed      = "bool"
  qa_findings = { list = { severity = { enum = ["low", "high"] }, detail = "text" } }

  [step.loop]
  when           = "qa.passed == 'false'"
  goto           = "implement"
  max_iterations = 2
  feedback       = "@qa"

# ─── 12. Security review ─────────────────────────────────────────────────────
# Post-implementation security gate: a human reviews the actual diff.
# Shows: output_type = "bool" on a review step (true = cleared, false = blocked);
#   when = "qa.passed" bare bool field guard (skip if QA failed — no point in
#   security-reviewing broken code).
#
# NOTE: compound guards are not yet supported (see callout #2 at top). The ideal
#   guard here would be "qa.passed AND security_scan.risk_level != 'none'", but
#   the current grammar only allows a single condition. As a workaround the
#   implement step does not depend on security_scan directly, so the security_scan
#   findings inform the plan rather than gate the diff review.
[[step]]
id          = "security_review"
type        = "review"
depends_on  = ["qa"]
when        = "qa.passed"
review      = "diff"
output_type = "bool"

# ─── 13. Final review ────────────────────────────────────────────────────────
# Last human gate before shipping. Runs only when security cleared the diff.
# Shows: bare bool output_type guard ("security_review" = the step's bool verdict);
#   max_messages lets the human query the QA agent for details before deciding;
#   output_type = { enum } for a named terminal branch choice.
[[step]]
id           = "final_review"
type         = "review"
depends_on   = ["security_review", "qa"]
when         = "security_review"
review       = "@qa.summary"
output_type  = { enum = ["ship", "hold"] }
max_messages = 3

# ─── 14–15. Terminal branches ────────────────────────────────────────────────
# Mutually exclusive commands guarded on the final_review verdict.
# notify is advisory: a failure never aborts the workflow.
[[step]]
id         = "ship"
type       = "command"
depends_on = ["final_review"]
when       = "final_review == 'ship'"
script     = "scripts/ship.sh"

[[step]]
id         = "notify"
type       = "command"
depends_on = ["final_review"]
when       = "final_review == 'hold'"
run        = "echo 'held for follow-up; notifying owners'"
on_failure = "continue"
